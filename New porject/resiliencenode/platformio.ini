; ResilienceNode - PlatformIO Configuration
; Autonomous Network Black Box
; When connectivity fails, visibility shouldn't.

[env:esp32]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Enable partition table
board_build.partitions = partitions.csv

; Build flags
build_flags = 
    -DCONFIG_HTTPD_MAX_REQ_HDR_LEN=1024
    -DCONFIG_HTTPD_MAX_URI_LEN=512

; ESP-IDF sdkconfig defaults
board_build.embed_files =
    web/index.html

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
